<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Галерея Red Dead Redemption 2</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Галерея Red Dead Redemption 2</h1>
        <p>Зображення персонажів і світу моєї улюбленої гри.</p>
    </header>

    <main>
        <section class="gallery">
            <figure>
                <img src="images/rdr2.jpg"
                     alt="Банер гри Red Dead Redemption 2">
                <figcaption>Банер гри Red Dead Redemption 2</figcaption>
            </figure>

            <figure>
                <img src="images/arthur.jpg"
                     alt="Артур Морган у грі Red Dead Redemption 2">
                <figcaption>Артур Морган</figcaption>
            </figure>

            <figure>
                <img src="images/gang.jpg"
                     alt="Банда Ван дер Лінде">
                <figcaption>Банда Ван дер Лінде</figcaption>
            </figure>
        </section>

        <div class="decorative-element">RDR2</div>
    </main>
</body>
</html>
